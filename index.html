<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night_OS</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d14; --bg2: #12121e; --bg3: #1a1a2e;
      --text: #e8e4dc; --accent: #d4a853; --border: #2a2a3d;
      --dot-red: #e05555; --dot-green: #55a855; --dot-purple: #9955cc;
    }
    [data-theme="day"] {
      --bg: #faf9f7; --bg2: #f0ede8; --bg3: #e8e4de;
      --text: #1a1a1a; --accent: #b8862e; --border: #d4cfc8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; }
    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    .header { height: 48px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 12px; }
    .header-logo { font-size: 14px; font-weight: 700; color: var(--accent); cursor: pointer; white-space: nowrap; letter-spacing: 0.5px; }
    .header-logo:hover { opacity: 0.8; }
    .breadcrumb { flex: 1; display: flex; align-items: center; gap: 4px; overflow: hidden; font-size: 11px; color: var(--text); opacity: 0.6; }
    .breadcrumb-seg { cursor: pointer; padding: 2px 4px; border-radius: 3px; white-space: nowrap; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: transparent; transition: text-decoration-color 0.15s; }
    .breadcrumb-seg:hover { background: var(--bg3); opacity: 1; text-decoration-color: var(--accent); }
    .breadcrumb-sep { opacity: 0.4; }
    .header-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .header-email { font-size: 11px; opacity: 0.5; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .hbtn { background: none; border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 4px 8px; border-radius: 4px; cursor: pointer; line-height: 1; }
    .hbtn:hover { border-color: var(--accent); color: var(--accent); }

    /* Map Module */
    .map-module { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; }
    .map-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .map-box { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: var(--bg3); color: var(--text); opacity: 0.7; transition: all 0.15s; min-width: 48px; text-align: center; }
    .map-box:hover { opacity: 1; border-color: var(--accent); }
    .map-box.active { border-color: var(--accent); color: var(--accent); opacity: 1; background: var(--bg); }

    /* Main */
    .main { flex: 1; overflow-y: auto; padding: 16px; }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: var(--bg); }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Panel grid */
    .panel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .panel-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; min-height: 100px; }
    .panel-card:hover { border-color: var(--accent); background: var(--bg3); }
    .panel-card.new-stub { border-style: dashed; opacity: 0.4; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .panel-card.new-stub:hover { opacity: 0.7; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .card-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-sub { font-size: 10px; opacity: 0.5; margin-bottom: 10px; }
    .card-content-preview { font-size: 10px; opacity: 0.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
    .card-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
    .panel-card:hover .card-actions { display: flex; }

    /* Standard list */
    .standard-list { display: flex; flex-direction: column; gap: 4px; }
    .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 4px; cursor: pointer; transition: border-color 0.15s; }
    .list-row:hover { border-left-color: var(--accent); border-color: var(--accent); }
    .list-row-name { flex: 1; font-size: 13px; font-weight: 500; }
    .list-row-sub { font-size: 11px; opacity: 0.45; }
    .list-row-content { font-size: 11px; opacity: 0.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
    .list-row-actions { display: none; gap: 4px; }
    .list-row:hover .list-row-actions { display: flex; }

    /* Color dots */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-red { background: var(--dot-red); }
    .dot-green { background: var(--dot-green); }
    .dot-purple { background: var(--dot-purple); }

    /* Icon buttons */
    .icon-btn { background: none; border: 1px solid transparent; color: var(--text); font-size: 11px; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-family: inherit; line-height: 1; opacity: 0.6; }
    .icon-btn:hover { border-color: var(--border); opacity: 1; }
    .icon-btn.danger:hover { border-color: var(--dot-red); color: var(--dot-red); opacity: 1; }

    /* Slot bar */
    .slot-bar { display: flex; gap: 2px; align-items: center; }
    .slot-pip { width: 8px; height: 3px; border-radius: 2px; background: var(--border); }
    .slot-pip.filled { background: var(--accent); }

    /* Section */
    .section-heading { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: 0.5; margin-bottom: 12px; }
    .section-count { font-size: 11px; opacity: 0.4; margin-bottom: 16px; }
    .empty-hint { opacity: 0.3; font-size: 12px; text-align: center; padding: 40px 0; }
    .placeholder-box { background: var(--bg2); border: 1px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; opacity: 0.45; font-size: 12px; }
    .loading { opacity: 0.4; font-size: 12px; padding: 24px 0; text-align: center; }

    /* Command bar */
    .command-bar { height: 44px; min-height: 44px; display: flex; align-items: center; background: var(--bg2); border-top: 1px solid var(--border); padding: 0 16px; position: relative; }
    .cmd-prompt { font-size: 11px; opacity: 0.7; white-space: nowrap; margin-right: 6px; display: flex; align-items: center; gap: 2px; }
    .cmd-prompt-seg { cursor: pointer; color: var(--accent); padding: 1px 3px; border-radius: 3px; }
    .cmd-prompt-seg:hover { text-decoration: underline; text-underline-offset: 2px; opacity: 1; }
    .cmd-prompt-sep { opacity: 0.4; padding: 0 1px; }
    .cmd-input { flex: 1; background: none; border: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text); caret-color: var(--accent); }
    .cmd-suggestions { position: absolute; bottom: 44px; left: 0; right: 0; background: var(--bg3); border-top: 1px solid var(--border); max-height: 160px; overflow-y: auto; }
    .cmd-suggestion { padding: 6px 16px; font-size: 12px; cursor: pointer; opacity: 0.7; }
    .cmd-suggestion:hover, .cmd-suggestion.selected { background: var(--bg2); opacity: 1; color: var(--accent); }

    /* Auth / form */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; width: 360px; padding: 28px; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 20px; letter-spacing: 0.5px; }
    .modal-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .modal-tab { flex: 1; padding: 6px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: inherit; font-size: 11px; cursor: pointer; opacity: 0.6; }
    .modal-tab.active { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 10px; opacity: 0.5; display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
    .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-family: inherit; font-size: 13px; color: var(--text); outline: none; }
    .form-input:focus { border-color: var(--accent); }
    .form-btn { width: 100%; padding: 10px; background: var(--accent); border: none; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--bg); cursor: pointer; margin-top: 6px; }
    .form-btn:hover { opacity: 0.85; }
    .form-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .form-msg { font-size: 11px; margin-top: 10px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .form-msg.error { border-color: var(--dot-red); color: var(--dot-red); }
    .form-msg.success { border-color: var(--dot-green); color: var(--dot-green); }

    /* Settings */
    .settings-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 12px; }
    .settings-section-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: 0.5; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 12px; }
    .setting-desc { font-size: 10px; opacity: 0.45; margin-top: 2px; }
    .toggle { width: 36px; height: 20px; background: var(--border); border-radius: 10px; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; border: none; }
    .toggle.on { background: var(--accent); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--bg); border-radius: 50%; transition: transform 0.2s; }
    .toggle.on::after { transform: translateX(16px); }
    .settings-saved { font-size: 10px; color: var(--dot-green); opacity: 0; transition: opacity 0.4s; }
    .settings-saved.show { opacity: 1; }

    /* Archive */
    .archive-search { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 13px; color: var(--text); outline: none; margin-bottom: 12px; }
    .archive-search:focus { border-color: var(--accent); }
    .archive-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .archive-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); opacity: 0.5; font-weight: 600; letter-spacing: 0.5px; }
    .archive-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); opacity: 0.8; vertical-align: top; }
    .archive-table tr:hover td { background: var(--bg2); opacity: 1; }
    .restore-btn { background: none; border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 10px; padding: 2px 7px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .restore-btn:hover { border-color: var(--dot-green); color: var(--dot-green); }
    .restore-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .restore-err { background: var(--bg3); border: 1px solid var(--dot-red); border-radius: 4px; padding: 8px 12px; font-size: 11px; color: var(--dot-red); margin-bottom: 12px; display: flex; align-items: flex-start; gap: 8px; }
    .restore-err-dismiss { background: none; border: none; color: var(--dot-red); cursor: pointer; font-size: 13px; padding: 0 4px; margin-left: auto; line-height: 1; }

    /* Journal */
    .journal-entry { background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--dot-purple); border-radius: 4px; padding: 14px; margin-bottom: 10px; }
    .journal-entry-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .journal-entry-body { font-size: 12px; opacity: 0.7; white-space: pre-wrap; }
    .journal-entry-meta { font-size: 10px; opacity: 0.35; margin-top: 8px; }

    /* Fragment full view */
    .fragment-card { background: var(--bg2); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 4px; padding: 14px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
    .fragment-card:hover { border-color: var(--accent); background: var(--bg3); }
    .fragment-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .fragment-card-name { font-size: 12px; font-weight: 600; flex: 1; }

    /* EOD Banner */
    .eod-banner { position: fixed; bottom: 44px; left: 0; right: 0; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 200; font-size: 12px; border-top: 2px solid var(--accent); background: var(--bg2); }
    .eod-banner.warn { border-color: var(--dot-red); }
    .eod-banner.done { border-color: var(--dot-green); }
    .eod-banner-text { display: flex; align-items: center; gap: 10px; }
    .eod-banner-dismiss { background: none; border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 11px; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
    .eod-banner-dismiss:hover { border-color: var(--accent); }

    /* Collabs */
    .collab-section { margin-bottom: 20px; }
    .collab-section-title { font-size: 10px; font-weight: 600; letter-spacing: 1px; opacity: 0.45; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .badge { background: var(--dot-purple); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
    .pending-invite { background: var(--bg2); border: 1px solid var(--dot-purple); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .pending-invite-info { flex: 1; }
    .pending-invite-node { font-size: 13px; font-weight: 600; margin-bottom: 2px; color: var(--accent); }
    .pending-invite-from { font-size: 11px; opacity: 0.5; }
    .pending-invite-actions { display: flex; gap: 6px; }
    .sent-invite { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .invite-status { font-size: 10px; padding: 2px 7px; border-radius: 3px; border: 1px solid currentColor; }
    .invite-status.pending { color: var(--accent); opacity: 0.7; }
.invite-link-panel { background: var(--bg2); border: 1px solid var(--dot-green); border-radius: 8px; padding: 14px 16px; margin-top: 10px; }
    .invite-link-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-bottom: 8px; }
    .invite-link-row { display: flex; gap: 8px; align-items: center; }
    .invite-link-hint { font-size: 11px; opacity: 0.45; margin-top: 6px; }
    .invite-accept-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .invite-accept-box { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; max-width: 360px; width: 90%; }
    .invite-accept-title { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
    .invite-accept-project { font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 20px; }
    .invite-accept-actions { display: flex; gap: 10px; }
    .invite-status.accepted { color: var(--dot-green); }
    .invite-status.declined { color: var(--dot-red); }
    .invite-form { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .invite-form-row { display: flex; gap: 8px; align-items: flex-end; }
    .invite-form-row .form-group { flex: 1; margin-bottom: 0; }

    /* Account section */
    .account-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .account-row:last-child { border-bottom: none; }
    .account-label { font-size: 10px; opacity: 0.45; margin-bottom: 4px; letter-spacing: 0.5px; }
    .account-value { font-size: 12px; }
    .danger-btn { background: none; border: 1px solid var(--dot-red); color: var(--dot-red); font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .danger-btn:hover { background: var(--dot-red); color: var(--bg); }

    /* Rank / reorder */
    .rank-badge { font-size: 10px; opacity: 0.35; letter-spacing: 0.3px; white-space: nowrap; }
    .move-btn { background: none; border: none; color: var(--text); font-size: 11px; padding: 2px 3px; cursor: pointer; opacity: 0.35; font-family: inherit; line-height: 1; }
    .move-btn:hover { opacity: 1; }
    .swap-btn { background: none; border: 1px solid transparent; color: var(--text); font-size: 11px; padding: 2px 5px; cursor: pointer; opacity: 0.35; font-family: inherit; line-height: 1; border-radius: 3px; }
    .swap-btn:hover { opacity: 0.8; border-color: var(--border); }
    .swap-btn.pending { opacity: 1; border-color: var(--accent); color: var(--accent); }
    .panel-card.swap-pending { outline: 1px solid var(--accent); }
    .list-row.swap-pending { border-left: 2px solid var(--accent); }
    .panel-card[draggable] { cursor: grab; }
    .panel-card.drag-over { outline: 1px dashed var(--accent); opacity: 0.7; }
    .list-row[draggable] { cursor: grab; }
    .list-row.drag-over { border-left: 2px dashed var(--accent); opacity: 0.7; }
    .eod-top-n-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .eod-top-n-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 4px 8px; border-radius: 4px; width: 52px; text-align: center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="text/babel">
  /*
  =========================================================
  PHASE 1 SCHEMA — run once in Supabase SQL editor
  =========================================================
  CREATE TABLE nodes (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE NOT NULL,
    parent_id uuid REFERENCES nodes(id) ON DELETE CASCADE,
    area text NOT NULL CHECK (area IN ('new_day','context','collabs')),
    level text NOT NULL CHECK (level IN ('category','note','detail','fragment')),
    name text NOT NULL DEFAULT '',
    content text DEFAULT '',
    sort_order int DEFAULT 0,
    is_project boolean DEFAULT false,
    created_at timestamptz DEFAULT now(),
    updated_at timestamptz DEFAULT now()
  );
  CREATE TABLE journal_entries (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE NOT NULL,
    title text DEFAULT '',
    content text DEFAULT '',
    sort_order int DEFAULT 0,
    entry_date date DEFAULT current_date,
    archived_at timestamptz,
    created_at timestamptz DEFAULT now(),
    updated_at timestamptz DEFAULT now()
  );
  CREATE TABLE archive_rows (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE NOT NULL,
    original_path text NOT NULL,
    level text NOT NULL,
    parent_name text DEFAULT '',
    content text DEFAULT '',
    archived_at timestamptz DEFAULT now()
  );
  CREATE TABLE collab_invites (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    node_id uuid REFERENCES nodes(id) ON DELETE CASCADE NOT NULL,
    owner_id uuid REFERENCES auth.users(id) ON DELETE CASCADE NOT NULL,
    invitee_email text NOT NULL,
    invitee_id uuid REFERENCES auth.users(id),
    status text DEFAULT 'pending' CHECK (status IN ('pending','accepted','declined')),
    invite_token text UNIQUE DEFAULT encode(gen_random_bytes(32),'hex'),
    created_at timestamptz DEFAULT now(),
    updated_at timestamptz DEFAULT now()
  );
  CREATE TABLE user_settings (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE UNIQUE NOT NULL,
    theme text DEFAULT 'night',
    view_mode text DEFAULT 'panel',
    life_default boolean DEFAULT true,
    rules jsonb DEFAULT '{"notify_before_eod":true,"auto_append_matched":true,"auto_archive_unmatched":true,"auto_assign_projects_context":true,"archive_journal_at_eod":true,"keep_empty_categories":false}'::jsonb,
    created_at timestamptz DEFAULT now(),
    updated_at timestamptz DEFAULT now()
  );
  CREATE TABLE eod_log (
    id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id uuid REFERENCES auth.users(id) ON DELETE CASCADE NOT NULL,
    processed_at timestamptz DEFAULT now(),
    merged_count int DEFAULT 0,
    archived_count int DEFAULT 0,
    summary jsonb DEFAULT '{}'::jsonb
  );
  ALTER TABLE nodes ENABLE ROW LEVEL SECURITY;
  ALTER TABLE journal_entries ENABLE ROW LEVEL SECURITY;
  ALTER TABLE archive_rows ENABLE ROW LEVEL SECURITY;
  ALTER TABLE collab_invites ENABLE ROW LEVEL SECURITY;
  ALTER TABLE user_settings ENABLE ROW LEVEL SECURITY;
  ALTER TABLE eod_log ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "own_nodes" ON nodes USING (user_id = auth.uid()) WITH CHECK (user_id = auth.uid());
  CREATE POLICY "own_journal" ON journal_entries USING (user_id = auth.uid()) WITH CHECK (user_id = auth.uid());
  CREATE POLICY "own_archive" ON archive_rows USING (user_id = auth.uid()) WITH CHECK (user_id = auth.uid());
  CREATE POLICY "own_settings" ON user_settings USING (user_id = auth.uid()) WITH CHECK (user_id = auth.uid());

  // ── Tree utils ───────────────────────────────────────
  function buildTree(flatNodes) {
    const map = {};
    flatNodes.forEach(n => { map[n.id] = { ...n, children: [] }; });
    const roots = [];
    flatNodes.forEach(n => {
      if (n.parent_id && map[n.parent_id]) map[n.parent_id].children.push(map[n.id]);
      else roots.push(map[n.id]);
    });
    function sort(node) { node.children.sort((a,b) => a.sort_order - b.sort_order); node.children.forEach(sort); }
    roots.sort((a,b) => a.sort_order - b.sort_order);
    roots.forEach(sort);
    return roots;
  }

  function findNodeByPath(tree, pathSegs) {
    if (!pathSegs || pathSegs.length === 0) return null;
    let current = tree; let node = null;
    for (const seg of pathSegs) {
      node = (current || []).find(n => n.name === seg);
      if (!node) return null;
      current = node.children;
    }
    return node;
  }

  function computeDot(node, pathFromCategory, contextTree) {
    if (pathFromCategory[1] === 'journal' || pathFromCategory[0] === 'journal') return 'purple';
    // Check alignment at note level (depth 2) max — details/fragments inherit from ancestor match.
    // A node is green if its path OR any ancestor path up to depth 2 exists in context.
    const checkDepth = Math.min(pathFromCategory.length, 2);
    for (let d = checkDepth; d >= 1; d--) {
      if (findNodeByPath(contextTree, pathFromCategory.slice(0, d))) return 'green';
    }
    return 'red';
  }

  // ── EOD processing ───────────────────────────────────
  async function runEODProcessing(userId, rules, nodes, journalEntries) {
    const today = new Date().toISOString().split('T')[0];
    try {
      const last = await DB.getEodLog(userId);
      if (last && last.processed_at && last.processed_at.startsWith(today)) return { skipped: true };
    } catch(e) {}

    const ndTree = buildTree(nodes.new_day || []);
    const ctxTree = buildTree(nodes.context || []);
    let merged = 0, archived = 0;

    // Seed node detection — name + position in the life hierarchy
    const SEED_NOTE_NAMES = new Set(LIFE_SEED.map(s => s.note));
    const SEED_DETAIL_MAP = {};
    LIFE_SEED.forEach(s => { if (s.details.length) SEED_DETAIL_MAP[s.note] = new Set(s.details); });

    function isSeedNode(nodeName, parentName) {
      if (nodeName === 'life') return true;
      if (parentName === 'life' && SEED_NOTE_NAMES.has(nodeName)) return true;
      if (SEED_DETAIL_MAP[parentName] && SEED_DETAIL_MAP[parentName].has(nodeName)) return true;
      return false;
    }

    function subtreeHasContent(node) {
      if (node.content && node.content.trim()) return true;
      return (node.children || []).some(subtreeHasContent);
    }

    async function archiveTree(node, path, parentName = '') {
      const seed = isSeedNode(node.name, parentName);
      const skip = seed && !subtreeHasContent(node);
      if (!skip) {
        try {
          await DB.addArchiveRow({ user_id: userId, original_path: `new_day.${path.join('.')}`, level: node.level, parent_name: path.length > 1 ? path[path.length - 2] : 'new_day', content: node.content || '' });
          archived++;
        } catch(e) {}
      }
      for (const child of (node.children || [])) await archiveTree(child, [...path, child.name], node.name);
    }

    async function appendFragments(ndNode, ctxNode) {
      // ctxNode = matching context node at same level as ndNode (or deepest ancestor fallback)
      if (!ctxNode) return;
      for (const child of (ndNode.children || [])) {
        if (child.level === 'fragment') {
          // Fragments always merge into ctxNode (their logical parent in context)
          if (child.content) {
            const siblings = (ctxNode.children || []).length;
            if (siblings < 10) {
              try {
                await DB.createNode({ user_id: userId, area: 'context', parent_id: ctxNode.id, level: 'fragment', name: child.name, content: child.content, sort_order: siblings });
                merged++;
              } catch(e) {}
            }
          }
        } else {
          // Note or detail: recurse into matching context child, or fall back to ctxNode
          const ctxChild = (ctxNode.children || []).find(c => c.name === child.name);
          await appendFragments(child, ctxChild || ctxNode);
        }
      }
    }

    if (rules.auto_append_matched || rules.auto_archive_unmatched) {
      const processTree = (rules.eod_top_n_only && rules.eod_top_n > 0)
        ? ndTree.slice(0, rules.eod_top_n)
        : ndTree;
      for (const cat of processTree) {
        const dot = computeDot(cat, [cat.name], ctxTree);
        if (dot === 'purple') continue;
        if (dot === 'green' && rules.auto_append_matched) {
          const ctxCat = ctxTree.find(c => c.name === cat.name);
          await appendFragments(cat, ctxCat);
          await archiveTree(cat, [cat.name], '');
          try { await DB.deleteNode(cat.id); } catch(e) {}
        } else if (dot === 'red' && rules.auto_archive_unmatched) {
          await archiveTree(cat, [cat.name], '');
          try { await DB.deleteNode(cat.id); } catch(e) {}
        }
      }
    }

    if (rules.archive_journal_at_eod) {
      for (const entry of (journalEntries || [])) {
        const title = entry.title || `entry_${entry.sort_order}`;
        try {
          await DB.addArchiveRow({ user_id: userId, original_path: `journal.${today}.${title}`, level: 'journal_entry', parent_name: today, content: entry.content || '' });
          await DB.updateJournalEntry(entry.id, { archived_at: new Date().toISOString() });
          archived++;
        } catch(e) {}
      }
    }

    try { await DB.addEodLog(userId, merged, archived, { date: today }); } catch(e) {}
    return { merged, archived };
  }

  function useEODTimer(userId, onWarn, onComplete) {
    const userIdRef = React.useRef(userId);
    const onWarnRef = React.useRef(onWarn);
    const onCompleteRef = React.useRef(onComplete);
    React.useEffect(() => { userIdRef.current = userId; }, [userId]);
    React.useEffect(() => { onWarnRef.current = onWarn; }, [onWarn]);
    React.useEffect(() => { onCompleteRef.current = onComplete; }, [onComplete]);

    React.useEffect(() => {
      if (!userId) return;
      function msUntil(h, m, s) {
        const now = new Date();
        const t = new Date(now);
        t.setHours(h, m, s, 0);
        if (t <= now) t.setDate(t.getDate() + 1);
        return t - now;
      }
      const warnTimer = setTimeout(() => onWarnRef.current && onWarnRef.current(), msUntil(23, 30, 0));
      const eodTimer = setTimeout(() => onCompleteRef.current && onCompleteRef.current(), msUntil(23, 59, 59));
      return () => { clearTimeout(warnTimer); clearTimeout(eodTimer); };
    }, [userId]);
  }

  // ── Archive restore ───────────────────────────────────
  async function restoreArchiveRow(row, userId) {
    const parts = row.original_path.split('.');
    if (parts.length < 2) throw new Error('Cannot restore: invalid archive path.');
    const area = parts[0];
    const pathInArea = parts.slice(1);
    const name = pathInArea[pathInArea.length - 1];
    const parentPath = pathInArea.slice(0, -1);
    const level = row.level;

    if (area === 'journal') {
      await DB.createJournalEntry({ user_id: userId, title: name, content: row.content || '', entry_date: new Date().toISOString().split('T')[0], sort_order: 0 });
      return { area: 'journal' };
    }

    if (!['new_day','context','collabs'].includes(area)) throw new Error(`Cannot restore to area: ${area}`);

    const currentNodes = await DB.getNodes(userId, area);
    const tree = buildTree(currentNodes);
    let parentNode = null;
    let siblings = tree;

    if (parentPath.length > 0) {
      parentNode = findNodeByPath(tree, parentPath);
      if (!parentNode) throw new Error(`restore_blocked: Parent path "${parentPath.join('.')}" not found. Create the parent structure first.`);
      siblings = parentNode.children || [];
    }

    if (siblings.length >= 10) {
      const loc = parentNode ? `"${parentNode.name}"` : area;
      throw new Error(`restore_blocked: ${loc} is at capacity (10/10). Free a slot before restoring.`);
    }
    if (siblings.some(s => s.name === name)) throw new Error(`An item named "${name}" already exists at this location.`);

    await DB.createNode({ user_id: userId, area, parent_id: parentNode ? parentNode.id : null, level, name, content: row.content || '', sort_order: siblings.length });
    return { area };
  }

  // ── Map Module ────────────────────────────────────────
  function MapModule({ path, nodes, onNavigate }) {
    const rows = [];
    rows.push(
      <div key="contents" className="map-row">
        {CONTENTS.map(c => (
          <div key={c.key} className={`map-box${path[0]===c.key?' active':''}`} onClick={() => onNavigate([c.key])}>{c.label}</div>
        ))}
      </div>
    );
    if (path[0] === 'new_day' || path[0] === 'context') {
      const area = path[0];
      const tree = buildTree(nodes[area] || []);
      const levels = [tree];
      for (let i = 1; i < path.length; i++) {
        const p = findNodeByPath(tree, path.slice(1, i+1));
        if (p && p.children.length > 0) levels.push(p.children);
        else break;
      }
      for (let lvl = 0; lvl < levels.length && lvl < 4; lvl++) {
        const items = levels[lvl]; const activeName = path[lvl+1];
        rows.push(
          <div key={`lvl-${lvl}`} className="map-row">
            {items.map(item => (
              <div key={item.id} className={`map-box${activeName===item.name?' active':''}`} onClick={() => onNavigate([area, ...path.slice(1, lvl+1), item.name])}>
                {item.name.slice(0,4).toUpperCase()}
              </div>
            ))}
          </div>
        );
      }
    }
    return <div className="map-module">{rows}</div>;
  }

  // ── WorkspaceView ─────────────────────────────────────
  function WorkspaceView({ area, path, nodes, contextNodes, viewMode, onNavigate, onReload, userId }) {
    const [addModal, setAddModal] = React.useState(false);
    const [editModal, setEditModal] = React.useState(null);
    const [deleteModal, setDeleteModal] = React.useState(null);
    const [swapFirst, setSwapFirst] = React.useState(null);
    const [focusedId, setFocusedId] = React.useState(null);
    const [dragOverId, setDragOverId] = React.useState(null);
    const dragIdRef = React.useRef(null);

    const relPath = path.slice(1);
    const areaNodes = nodes[area] || [];
    const tree = buildTree(areaNodes);
    const contextTree = buildTree(contextNodes || []);

    let parentNode = null;
    let currentItems = tree;
    let currentLevel = 'category';

    if (relPath.length > 0) {
      parentNode = findNodeByPath(tree, relPath);
      currentItems = parentNode ? parentNode.children : [];
      currentLevel = relPath.length === 1 ? 'note' : relPath.length === 2 ? 'detail' : 'fragment';
    }

    const currentItemsRef = React.useRef(currentItems);
    React.useEffect(() => { currentItemsRef.current = currentItems; }, [currentItems]);

    async function moveNode(node, dir) {
      const sorted = currentItemsRef.current;
      const idx = sorted.findIndex(n => n.id === node.id);
      if (idx === -1) return;
      if (dir === 'up' && idx === 0) return;
      if (dir === 'down' && idx === sorted.length - 1) return;
      const other = sorted[dir === 'up' ? idx - 1 : idx + 1];
      try {
        await DB.swapSortOrders(node.id, other.sort_order, other.id, node.sort_order);
        onReload(area);
      } catch(e) { console.error('moveNode failed:', e); }
    }

    function handleDragStart(e, node) {
      dragIdRef.current = node.id;
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDrop(e, node) {
      e.preventDefault();
      setDragOverId(null);
      if (!dragIdRef.current || dragIdRef.current === node.id) return;
      const dragNode = currentItemsRef.current.find(n => n.id === dragIdRef.current);
      if (!dragNode) return;
      dragIdRef.current = null;
      DB.swapSortOrders(dragNode.id, node.sort_order, node.id, dragNode.sort_order)
        .then(() => onReload(area))
        .catch(e => console.error(e));
    }

    function handleSwap(node) {
      if (!swapFirst) {
        setSwapFirst(node);
      } else if (swapFirst.id === node.id) {
        setSwapFirst(null);
      } else {
        DB.swapSortOrders(swapFirst.id, node.sort_order, node.id, swapFirst.sort_order)
          .then(() => { onReload(area); })
          .catch(e => console.error('swap failed:', e));
        setSwapFirst(null);
      }
    }

    // Keyboard shortcuts — Shift+Arrow: reorder rank; Ctrl+Arrow: navigate level
    React.useEffect(() => {
      async function handleKeyDown(e) {
        if (addModal || editModal || deleteModal) return;
        if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;

        // Ctrl+Arrow: navigate up a level or into focused node
        if (e.ctrlKey || e.metaKey) {
          if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            onNavigate(path.slice(0, -1));
          } else if ((e.key === 'ArrowDown' || e.key === 'ArrowRight') && focusedId) {
            e.preventDefault();
            const node = currentItemsRef.current.find(n => n.id === focusedId);
            if (node && node.level !== 'fragment') {
              onNavigate([area, ...relPath, node.name]);
            }
          }
          return;
        }

        // Shift+Arrow: reorder focused node rank
        if (e.shiftKey && focusedId) {
          e.preventDefault();
          const dir = (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? 'up' : 'down';
          const node = currentItemsRef.current.find(n => n.id === focusedId);
          if (node) await moveNode(node, dir);
        }
      }
      window.addEventListener('keydown', handleKeyDown);
      return () => window.removeEventListener('keydown', handleKeyDown);
    }, [focusedId, addModal, editModal, deleteModal, path, area, relPath]);

    function getDotClass(node) {
      if (area !== 'new_day') return null;
      const pathFromCat = relPath.length === 0 ? [node.name] : [...relPath, node.name];
      return computeDot(node, pathFromCat, contextTree);
    }

    function handleNodeClick(node) {
      setFocusedId(node.id);
      if (node.level === 'fragment') setEditModal(node);
      else onNavigate([area, ...relPath, node.name]);
    }

    const nextLvl = relPath.length === 0 ? 'category' : nextLevel(relPath.length <= 3 ? LEVELS[relPath.length - 1] : 'fragment');

    function renderFragmentView() {
      if (!parentNode) return <div className="empty-hint">Navigate to a detail to see fragments.</div>;
      return (
        <div>
          <div className="section-heading" style={{display:'flex',alignItems:'center',gap:10}}>
            {area} · {relPath.join(' › ')}
            <span style={{opacity:0.4,fontWeight:400,letterSpacing:0}}>{currentItems.length}/10</span>
            <button className="hbtn" style={{marginLeft:'auto'}} onClick={() => setAddModal(true)}>+ New fragment</button>
          </div>
          {currentItems.length === 0 && <div className="empty-hint">No fragments yet. Add one to start.</div>}
          {currentItems.map((node, idx) => {
            const dot = getDotClass(node);
            return (
              <div key={node.id} className="fragment-card" onClick={() => setEditModal(node)}>
                <div className="fragment-card-header">
                  {dot && <div className={`dot dot-${dot}`} title={dot} />}
                  <span className="fragment-card-name">{node.name}</span>
                  <span className="rank-badge">#{idx + 1}</span>
                  <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'up');}} title="Move up">↑</button>
                  <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'down');}} title="Move down">↓</button>
                  <button className="icon-btn" onClick={e => { e.stopPropagation(); setEditModal(node); }} title="Edit">✎</button>
                  <button className="icon-btn danger" onClick={e => { e.stopPropagation(); setDeleteModal(node); }} title="Delete">✕</button>
                </div>
              </div>
            );
          })}
          {addModal && <AddNodeModal area={area} parentId={parentNode.id} level="fragment" siblingCount={currentItems.length} userId={userId} onClose={() => setAddModal(false)} onSaved={() => { setAddModal(false); onReload(area); }} />}
          {editModal && <EditNodeModal node={editModal} onClose={() => setEditModal(null)} onSaved={() => { setEditModal(null); onReload(area); }} />}
          {deleteModal && <DeleteNodeConfirm node={deleteModal} onClose={() => setDeleteModal(null)} onDeleted={() => { setDeleteModal(null); onReload(area); }} />}
        </div>
      );
    }

    if (currentLevel === 'fragment') return renderFragmentView();

    function renderNode(node, rank) {
      const dot = getDotClass(node);
      const childCount = node.children ? node.children.length : 0;
      const isFocused = focusedId === node.id;
      const isSwapPending = swapFirst?.id === node.id;
      const swapLabel = swapFirst ? (isSwapPending ? 'cancel swap' : 'swap with #' + (currentItems.findIndex(n=>n.id===swapFirst.id)+1)) : '⇄';

      if (viewMode === 'panel') {
        return (
          <div key={node.id} className={`panel-card${isSwapPending?' swap-pending':''}${isFocused?' focused':''}${dragOverId===node.id?' drag-over':''}`}
            onClick={() => handleNodeClick(node)} tabIndex={0} onFocus={() => setFocusedId(node.id)}
            draggable onDragStart={e=>handleDragStart(e,node)} onDragOver={e=>{e.preventDefault();setDragOverId(node.id);}} onDragLeave={()=>setDragOverId(null)} onDrop={e=>handleDrop(e,node)}>
            <div className="card-top">
              {dot && <div className={`dot dot-${dot}`} title={dot} />}
              <span className="card-name">{node.name}</span>
              <div className="card-actions">
                <span className="rank-badge">#{rank}</span>
                <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'up');}} title="Shift+↑ / Shift+← to move up">↑</button>
                <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'down');}} title="Shift+↓ / Shift+→ to move down">↓</button>
                <button className={`swap-btn${isSwapPending?' pending':swapFirst?' pending':''}`}
                  onClick={e=>{e.stopPropagation();handleSwap(node);}} title={swapFirst ? (isSwapPending ? 'Click to cancel' : 'Click to swap positions') : 'Select for position swap'}>⇄</button>
                <button className="icon-btn" onClick={e => { e.stopPropagation(); setEditModal(node); }} title="Edit">✎</button>
                <button className="icon-btn danger" onClick={e => { e.stopPropagation(); setDeleteModal(node); }} title="Delete">✕</button>
              </div>
            </div>
            {node.level !== 'fragment' && <div className="card-sub">{childCount}/10</div>}
            {node.level !== 'fragment' && <SlotBar filled={childCount} />}
            {node.content && <div className="card-content-preview">{node.content}</div>}
          </div>
        );
      }
      return (
        <div key={node.id} className={`list-row${isSwapPending?' swap-pending':''}${dragOverId===node.id?' drag-over':''}`}
          onClick={() => handleNodeClick(node)} tabIndex={0} onFocus={() => setFocusedId(node.id)}
          draggable onDragStart={e=>handleDragStart(e,node)} onDragOver={e=>{e.preventDefault();setDragOverId(node.id);}} onDragLeave={()=>setDragOverId(null)} onDrop={e=>handleDrop(e,node)}>
          {dot && <div className={`dot dot-${dot}`} title={dot} />}
          <span className="rank-badge">#{rank}</span>
          <span className="list-row-name">{node.name}</span>
          {node.content && <span className="list-row-content">{node.content}</span>}
          {node.level !== 'fragment' && <span className="list-row-sub">{childCount}/10</span>}
          <div className="list-row-actions">
            <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'up');}} title="Move up (Shift+↑)">↑</button>
            <button className="move-btn" onClick={e=>{e.stopPropagation();moveNode(node,'down');}} title="Move down (Shift+↓)">↓</button>
            <button className={`swap-btn${isSwapPending?' pending':''}`}
              onClick={e=>{e.stopPropagation();handleSwap(node);}} title={swapFirst ? (isSwapPending ? 'Cancel' : 'Swap with selected') : 'Select for swap'}>⇄</button>
            <button className="icon-btn" onClick={e => { e.stopPropagation(); setEditModal(node); }} title="Edit">✎</button>
            <button className="icon-btn danger" onClick={e => { e.stopPropagation(); setDeleteModal(node); }} title="Delete">✕</button>
          </div>
        </div>
      );
    }

    const heading = relPath.length === 0 ? area : `${area} › ${relPath.join(' › ')}`;
    const addLevel = relPath.length === 0 ? 'category' : (nextLevel(LEVELS[relPath.length - 1]) || 'fragment');
    const addParentId = parentNode ? parentNode.id : null;

    return (
      <div>
        {deleteModal && <DeleteNodeConfirm node={deleteModal} onClose={() => setDeleteModal(null)} onDeleted={() => { setDeleteModal(null); onReload(area); }} />}
        {editModal && <EditNodeModal node={editModal} onClose={() => setEditModal(null)} onSaved={() => { setEditModal(null); onReload(area); }} />}
        {addModal && <AddNodeModal area={area} parentId={addParentId} level={addLevel} siblingCount={currentItems.length} userId={userId} onClose={() => setAddModal(false)} onSaved={() => { setAddModal(false); onReload(area); }} />}
        <div className="section-heading" style={{display:'flex',alignItems:'center',gap:10}}>
          {heading}
          <span style={{opacity:0.4,fontWeight:400,letterSpacing:0}}>{currentItems.length}/10</span>
          {swapFirst && <span style={{fontSize:10,color:'var(--accent)',opacity:0.8}}>swap: select another panel to swap with</span>}
          <button className="hbtn" style={{marginLeft:'auto'}} onClick={() => setAddModal(true)}>+ New {addLevel}</button>
        </div>
        {currentItems.length === 0 && <div className="empty-hint">Empty. Add a {addLevel} to start.</div>}
        {viewMode === 'panel'
          ? <div className="panel-grid">{currentItems.map((node, i) => renderNode(node, i + 1))}</div>
          : <div className="standard-list">{currentItems.map((node, i) => renderNode(node, i + 1))}</div>
        }
      </div>
    );
  }

  // ── JournalView ───────────────────────────────────────
  function JournalView({ journalEntries, userId, onReload }) {

  // ── ArchiveView ───────────────────────────────────────
  function ArchiveView({ userId, onReload }) {
    const [rows, setRows] = React.useState([]);
    const [count, setCount] = React.useState(0);
    const [search, setSearch] = React.useState('');
    const [loading, setLoading] = React.useState(true);
    const [restoring, setRestoring] = React.useState(null);
    const [restoreErr, setRestoreErr] = React.useState('');
    const [selected, setSelected] = React.useState(new Set());
    const [deleting, setDeleting] = React.useState(false);
    const [confirmBulk, setConfirmBulk] = React.useState(false);

    async function load() {
      setLoading(true);
      try {
        const [r, c] = await Promise.all([DB.getArchiveRows(userId, search), DB.getArchiveCount(userId)]);
        setRows(r); setCount(c);
      } catch(e) { console.warn(e); }
      finally { setLoading(false); }
    }

    React.useEffect(() => { load(); }, [search]);

    async function handleRestore(row) {
      setRestoring(row.id); setRestoreErr('');
      try {
        const result = await restoreArchiveRow(row, userId);
        if (result.area && onReload) onReload(result.area);
        await load();
      } catch(e) { setRestoreErr(e.message || 'Restore failed.'); }
      finally { setRestoring(null); }
    }

    async function handleDeleteRow(row) {
      try { await DB.deleteArchiveRow(row.id); await load(); }
      catch(e) { setRestoreErr(e.message || 'Delete failed.'); }
    }

    async function handleBulkDelete() {
      setDeleting(true); setConfirmBulk(false);
      try { await DB.deleteArchiveRows([...selected]); setSelected(new Set()); await load(); }
      catch(e) { setRestoreErr(e.message || 'Bulk delete failed.'); }
      finally { setDeleting(false); }
    }

    function toggleSelect(id) {
      setSelected(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });
    }

    function toggleAll() {
      if (selected.size === rows.length) setSelected(new Set());
      else setSelected(new Set(rows.map(r => r.id)));
    }

    const allChecked = rows.length > 0 && selected.size === rows.length;
    const someChecked = selected.size > 0;

    return (
      <div>
        <div className="section-heading" style={{display:'flex',alignItems:'center',gap:10}}>
          archive
          <span style={{opacity:0.4,fontWeight:400,letterSpacing:0}}>{count}/10,000</span>
          {someChecked && !confirmBulk && (
            <button className="danger-btn" style={{marginLeft:'auto',padding:'4px 12px',fontSize:11}}
              onClick={() => setConfirmBulk(true)} disabled={deleting}>
              Delete {selected.size} selected
            </button>
          )}
          {confirmBulk && (
            <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,opacity:0.7}}>Delete {selected.size} entries?</span>
              <button className="danger-btn" style={{padding:'4px 12px',fontSize:11}} onClick={handleBulkDelete} disabled={deleting}>{deleting?'Deleting...':'Confirm'}</button>
              <button className="hbtn" style={{padding:'4px 10px',fontSize:11}} onClick={() => setConfirmBulk(false)}>Cancel</button>
            </span>
          )}
        </div>
        {restoreErr && (
          <div className="restore-err">
            <span style={{flex:1}}>{restoreErr}</span>
            <button className="restore-err-dismiss" onClick={() => setRestoreErr('')}>✕</button>
          </div>
        )}
        <input className="archive-search" placeholder="Search paths, names, content..." value={search} onChange={e => setSearch(e.target.value)} />
        {loading ? <div className="loading">Loading archive...</div> : (
          rows.length === 0 ? (
            <div className="empty-hint">{search ? 'No matches.' : 'Archive is empty. Items arrive here at end of day.'}</div>
          ) : (
            <table className="archive-table">
              <thead>
                <tr>
                  <th style={{width:28,paddingRight:0}}>
                    <input type="checkbox" checked={allChecked} onChange={toggleAll} title="Select all" style={{cursor:'pointer'}} />
                  </th>
                  <th>Path</th><th>Level</th><th>Content</th><th>Archived</th><th></th>
                </tr>
              </thead>
              <tbody>
                {rows.map(row => (
                  <tr key={row.id} style={selected.has(row.id) ? {background:'var(--panel-hover)'} : {}}>
                    <td style={{paddingRight:0}}>
                      <input type="checkbox" checked={selected.has(row.id)} onChange={() => toggleSelect(row.id)} style={{cursor:'pointer'}} />
                    </td>
                    <td style={{fontWeight:500,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.original_path}</td>
                    <td style={{opacity:0.5,whiteSpace:'nowrap'}}>{row.level}</td>
                    <td style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',opacity:0.6}}>{row.content || '—'}</td>
                    <td style={{opacity:0.45,whiteSpace:'nowrap'}}>{new Date(row.archived_at).toLocaleDateString()}</td>
                    <td style={{whiteSpace:'nowrap'}}>
                      <button className="restore-btn" disabled={restoring === row.id} onClick={() => handleRestore(row)} style={{marginRight:4}}>
                        {restoring === row.id ? '...' : 'Restore'}
                      </button>
                      <button className="icon-btn danger" onClick={() => handleDeleteRow(row)} title="Delete entry">✕</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )
        )}
      </div>
    );
  }

  // ── CollabsView ───────────────────────────────────────
  function CollabsView({ userId, nodes, onReload, onNavigate }) {
    const [pending, setPending] = React.useState([]);
    const [sent, setSent] = React.useState([]);
    const [active, setActive] = React.useState([]);
    const [loadingInvites, setLoadingInvites] = React.useState(true);
    const [inviteLabel, setInviteLabel] = React.useState('');
    const [inviteNodeId, setInviteNodeId] = React.useState('');
    const [inviting, setInviting] = React.useState(false);
    const [inviteMsg, setInviteMsg] = React.useState(null);
    const [inviteLink, setInviteLink] = React.useState(null);
    const [copied, setCopied] = React.useState(false);
    const [responding, setResponding] = React.useState(null);

    function findPathById(nodeList, targetId, acc = []) {
      for (const node of nodeList) {
        const p = [...acc, node.name];
        if (node.id === targetId) return p;
        if (node.children && node.children.length > 0) {
          const found = findPathById(node.children, targetId, p);
          if (found) return found;
        }
      }
      return null;
    }

    function goToProject(invite) {
      if (!onNavigate || !invite.node) return;
      const area = invite.node.area || 'new_day';
      const tree = buildTree(nodes[area] || []);
      const segs = findPathById(tree, invite.node.id);
      onNavigate(segs ? [area, ...segs] : [area]);
    }

    function getProjectNodes(nodesArr, area) {
      const results = [];
      function walk(nodeList, inProjects, path) {
        for (const node of nodeList) {
          const p = [...path, node.name];
          const entering = inProjects || node.name === 'projects';
          if (entering && node.name !== 'projects') results.push({ id: node.id, label: p.join(' › '), area });
          if (node.children && node.children.length > 0) walk(node.children, entering, p);
        }
      }
      walk(buildTree(nodesArr), false, []);
      return results;
    }
    const projectNodes = [
      ...getProjectNodes(nodes.new_day || [], 'new_day'),
      ...getProjectNodes(nodes.context || [], 'context'),
    ];

    async function loadInvites() {
      try {
        const [p, s, a] = await Promise.all([DB.getPendingInvites(), DB.getSentInvites(userId), DB.getActiveCollabs(userId)]);
        setPending(p.filter(i => i.owner_id !== userId));
        setSent(s.filter(i => i.status !== 'accepted'));
        setActive(a);
      } catch(e) { console.warn('Collab load failed:', e); }
      setLoadingInvites(false);
    }

    React.useEffect(() => {
      if (!userId) return;
      loadInvites();
      const interval = setInterval(loadInvites, 15000);
      return () => clearInterval(interval);
    }, [userId]);

    async function handleInvite(e) {
      e.preventDefault();
      if (!inviteNodeId) { setInviteMsg({ type: 'error', text: 'Select a project to share.' }); return; }
      setInviting(true); setInviteMsg(null); setInviteLink(null);
      try {
        const data = await DB.createCollabInvite({ node_id: inviteNodeId, owner_id: userId, invitee_email: inviteLabel.trim() || null });
        const token = data && data.token;
        if (token) {
          setInviteLink(`https://nightskyos.vercel.app?invite=${token}`);
          setInviteMsg(null);
        } else {
          setInviteMsg({ type: 'success', text: 'Invite created.' });
        }
        setInviteLabel(''); setInviteNodeId('');
        loadInvites();
      } catch(ex) { setInviteMsg({ type: 'error', text: ex.message || 'Failed to send invite.' }); }
      finally { setInviting(false); }
    }

    async function handleRespond(invite, status) {
      setResponding(invite.id);
      try {
        await DB.respondCollabInvite(invite.id, status, userId);
        await loadInvites();
        if (status === 'accepted') onReload('collabs');
      } catch(e) { alert('Response failed: ' + e.message); }
      finally { setResponding(null); }
    }

    return (
      <div>
        <div className="section-heading" style={{display:'flex',alignItems:'center',gap:10}}>
          collabs
          {pending.length > 0 && <span className="badge">{pending.length}</span>}
        </div>

        {pending.length > 0 && (
          <div className="collab-section">
            <div className="collab-section-title">Pending Invites {pending.length > 0 && <span className="badge">{pending.length}</span>}</div>
            {pending.map(invite => (
              <div key={invite.id} className="pending-invite">
                <div className="pending-invite-info">
                  <div className="pending-invite-node">{invite.node?.name || 'Shared project'}</div>
                  <div className="pending-invite-from">from {invite.owner_id === userId ? 'you' : invite.invitee_email || 'teammate'} · {new Date(invite.created_at).toLocaleDateString()}</div>
                </div>
                <div className="pending-invite-actions">
                  <button className="hbtn" style={{borderColor:'var(--dot-green)',color:'var(--dot-green)'}} disabled={responding===invite.id} onClick={() => handleRespond(invite, 'accepted')}>Accept</button>
                  <button className="hbtn" style={{borderColor:'var(--dot-red)',color:'var(--dot-red)'}} disabled={responding===invite.id} onClick={() => handleRespond(invite, 'declined')}>Decline</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {active.length > 0 && (
          <div className="collab-section">
            <div className="collab-section-title">Active Collaborations</div>
            {active.map(invite => {
              const isOwner = invite.owner_id === userId;
              return (
                <div key={invite.id} className="sent-invite" style={{borderLeft:'3px solid var(--dot-green)'}}>
                  <div style={{flex:1}}>
                    <span style={{fontWeight:600}}>{invite.node?.name || 'Shared project'}</span>
                    <span style={{opacity:0.45,fontSize:11,marginLeft:10}}>
                      {isOwner ? `shared with ${invite.invitee_email || 'teammate'}` : 'shared with you'}
                    </span>
                  </div>
                  <button className="hbtn" style={{fontSize:11,padding:'4px 10px'}} onClick={() => goToProject(invite)}>→ Go to</button>
                  <span className="invite-status accepted" style={{color:'var(--dot-green)',marginLeft:8}}>active</span>
                </div>
              );
            })}
          </div>
        )}

        <div className="collab-section">
          <div className="collab-section-title">Invite Teammate</div>
          <div className="invite-form">
            <form onSubmit={handleInvite}>
              <div className="invite-form-row">
                <div className="form-group">
                  <label className="form-label">LABEL <span style={{opacity:0.4,fontWeight:400}}>(optional)</span></label>
                  <input className="form-input" type="text" value={inviteLabel} onChange={e=>setInviteLabel(e.target.value)} placeholder="e.g. teammate name" />
                </div>
                <div className="form-group" style={{minWidth:140}}>
                  <label className="form-label">PROJECT NODE</label>
                  <select className="form-input" value={inviteNodeId} onChange={e=>setInviteNodeId(e.target.value)}>
                    <option value="">Select a project...</option>
                    {projectNodes.map(n => <option key={n.id} value={n.id}>{n.label}</option>)}
                  </select>
                </div>
                <button type="submit" className="hbtn" disabled={inviting} style={{alignSelf:'flex-end',padding:'8px 14px'}}>
                  {inviting ? '...' : 'Invite'}
                </button>
              </div>
              {inviteMsg && <div className={`form-msg ${inviteMsg.type}`} style={{marginTop:8}}>{inviteMsg.text}</div>}
            {inviteLink && (
              <div className="invite-link-panel" style={{marginTop:10}}>
                <div className="invite-link-label">Share this link — no email sent</div>
                <div className="invite-link-row">
                  <input className="form-input" readOnly value={inviteLink} style={{flex:1,fontSize:11,fontFamily:'monospace'}} onFocus={e=>e.target.select()} />
                  <button type="button" className="hbtn" style={{whiteSpace:'nowrap'}} onClick={()=>{ navigator.clipboard.writeText(inviteLink); setCopied(true); setTimeout(()=>setCopied(false),2000); }}>{copied ? '✓ Copied' : 'Copy'}</button>
                  <button type="button" className="hbtn" style={{opacity:0.5}} onClick={()=>setInviteLink(null)}>✕</button>
                </div>
                <div className="invite-link-hint">Send this link to your teammate. They'll accept when they open it.</div>
              </div>
            )}
            </form>
          </div>
        </div>

        <div className="collab-section">
          <div className="collab-section-title">Sent Invites</div>
          {loadingInvites ? <div className="loading">Loading...</div> : sent.length === 0
            ? <div className="empty-hint" style={{padding:'20px 0'}}>No sent invites yet.</div>
            : sent.map(invite => (
              <div key={invite.id} className="sent-invite">
                <div>
                  <span style={{fontWeight:600,marginRight:8}}>{invite.node?.name || 'Unknown project'}</span>
                  <span style={{opacity:0.5}}>→ {invite.invitee_email}</span>
                </div>
                <span className={`invite-status ${invite.status}`}>{invite.status}</span>
              </div>
            ))
          }
        </div>
      </div>
    );
  }

  // ── CommandBar ────────────────────────────────────────
  function CommandBar({ path, nodes, onNavigate }) {
    const [input, setInput] = React.useState('');
    const [suggestions, setSuggestions] = React.useState([]);
    const [history, setHistory] = React.useState([]);
    const [historyIndex, setHistoryIndex] = React.useState(-1);
    const [selIdx, setSelIdx] = React.useState(-1);
    const inputRef = React.useRef(null);
    const promptSegs = path.length > 0 ? path : [];

    React.useEffect(() => {
      if (!input.trim()) { setSuggestions([]); return; }
      const currentArea = path[0];
      if (!currentArea || !['new_day','context','collabs'].includes(currentArea)) {
        setSuggestions(['settings','new_day','context','journal','archive','collabs'].filter(n => n.startsWith(input.toLowerCase())));
        return;
      }
      const tree = buildTree((nodes && nodes[currentArea]) || []);
      const relPath = path.slice(1);
      let children = relPath.length === 0 ? tree : (findNodeByPath(tree, relPath)?.children || []);
      setSuggestions(children.map(n=>n.name).filter(n => n.toLowerCase().startsWith(input.toLowerCase())));
      setSelIdx(-1);
    }, [input, path, nodes]);

    const AREAS = ['settings','new_day','context','journal','archive','collabs'];
    function pushHistory(cmd) { setHistory(prev => [cmd, ...prev.filter(h=>h!==cmd)].slice(0,10)); }
    function parseAndNavigate(raw) {
      const s = raw.trim(); if (!s) return;
      pushHistory(s); setHistoryIndex(-1);
      if (s === '..' || s === 'back') { onNavigate(path.slice(0,-1)); return; }
      if (s === '...' || s === '/' || s === 'home') { onNavigate([]); return; }
      // Support › or . as path separators; convert display spaces back to underscores
      let segs = null;
      if (s.includes('›')) segs = s.split('›').map(x => x.trim().replace(/ /g,'_')).filter(Boolean);
      else if (s.includes('.')) segs = s.split('.').map(x => x.trim().replace(/ /g,'_')).filter(Boolean);
      if (segs) { onNavigate(segs); return; }
      // Single segment — normalize spaces to underscores
      const clean = s.replace(/ /g,'_');
      // Absolute area name: always jump there from root
      if (AREAS.includes(clean)) { onNavigate([clean]); return; }
      // Relative: append to current path
      onNavigate([...path, clean]);
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        parseAndNavigate(selIdx >= 0 && suggestions[selIdx] ? suggestions[selIdx] : input);
        setInput(''); setSuggestions([]); setSelIdx(-1);
      } else if (e.key === 'Escape') {
        if (input) { setInput(''); setSuggestions([]); } else onNavigate(path.slice(0,-1));
      } else if (e.key === 'Backspace' && !input) {
        onNavigate(path.slice(0,-1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (suggestions.length > 0 && input) setSelIdx(i => Math.max(0,i-1));
        else if (!input) setHistoryIndex(i => { const n = Math.min(i+1,history.length-1); setInput(history[n]||''); return n; });
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (suggestions.length > 0 && input) setSelIdx(i => Math.min(suggestions.length-1,i+1));
        else if (!input) setHistoryIndex(i => { const n = Math.max(i-1,-1); setInput(n<0?'':(history[n]||'')); return n; });
      }
    }

    return (
      <div className="command-bar">
        {suggestions.length > 0 && (
          <div className="cmd-suggestions">
            {suggestions.map((s,i) => (
              <div key={s} className={`cmd-suggestion${i===selIdx?' selected':''}`} onClick={() => { parseAndNavigate(s); setInput(''); setSuggestions([]); }}>{s}</div>
            ))}
          </div>
        )}
        <span className="cmd-prompt">
          <span className="cmd-prompt-seg" onClick={() => onNavigate([])}>home</span>
          {promptSegs.map((seg, i) => (
            <React.Fragment key={i}>
              <span className="cmd-prompt-sep">›</span>
              <span className="cmd-prompt-seg" onClick={() => onNavigate(promptSegs.slice(0, i+1))}>{seg.replace(/_/g,' ')}</span>
            </React.Fragment>
          ))}
          <span className="cmd-prompt-sep">›</span>
        </span>
        <input ref={inputRef} className="cmd-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder="type to navigate..." autoComplete="off" spellCheck="false" />
      </div>
    );
  }

  // ── App ───────────────────────────────────────────────
  function App() {
    const { user, loading: authLoading } = useAuth();
    const [path, setPath] = React.useState([]);
    const [nodes, setNodes] = React.useState({ new_day: [], context: [], collabs: [] });
    const [journalEntries, setJournalEntries] = React.useState([]);
    const [settings, setSettings] = React.useState(DEFAULT_SETTINGS);
    const [dataLoading, setDataLoading] = React.useState(false);
    const [saveStatus, setSaveStatus] = React.useState('idle');
    const [eodBanner, setEodBanner] = React.useState(null);
    const [inviteModal, setInviteModal] = React.useState(null);
    const pendingInviteToken = React.useMemo(() => new URLSearchParams(window.location.search).get('invite'), []);

    const settingsDirtyRef = React.useRef(false);
    const saveTimerRef = React.useRef(null);
    const nodesRef = React.useRef(nodes);
    const journalRef = React.useRef(journalEntries);

    React.useEffect(() => { nodesRef.current = nodes; }, [nodes]);
    React.useEffect(() => { journalRef.current = journalEntries; }, [journalEntries]);

    // Invite token from URL — detect after login
    React.useEffect(() => {
      if (!user || !pendingInviteToken) return;
      DB.getInviteByToken(pendingInviteToken).then(invite => {
        if (invite && invite.owner_id !== user.id) setInviteModal(invite);
        window.history.replaceState({}, '', window.location.pathname);
      }).catch(() => {});
    }, [user, pendingInviteToken]);

    async function acceptInviteFromLink() {
      if (!inviteModal || !user) return;
      try {
        await DB.respondCollabInvite(inviteModal.id, 'accepted', user.id);
      } catch(e) { console.error(e); }
      setInviteModal(null);
    }

    // Theme
    React.useEffect(() => {
      document.documentElement.setAttribute('data-theme', settings.theme || 'night');
    }, [settings.theme]);

    // Settings auto-save debounce
    React.useEffect(() => {
      if (!user || !settingsDirtyRef.current) return;
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      setSaveStatus('saving');
      saveTimerRef.current = setTimeout(async () => {
        try {
          await DB.upsertSettings(user.id, settings);
          setSaveStatus('saved');
          setTimeout(() => setSaveStatus('idle'), 2500);
        } catch(e) { setSaveStatus('idle'); }
      }, 700);
    }, [settings]);

    function handleSettingsChange(newSettings) {
      settingsDirtyRef.current = true;
      setSettings(newSettings);
    }

    // Load all data
    React.useEffect(() => {
      if (!user) { setNodes({ new_day:[], context:[], collabs:[] }); setJournalEntries([]); setSettings(DEFAULT_SETTINGS); return; }
      setDataLoading(true);
      Promise.allSettled([
        DB.getNodes(user.id, 'new_day'),
        DB.getNodes(user.id, 'context'),
        DB.getNodes(user.id, 'collabs'),
        DB.getTodayJournal(user.id),
        DB.getSettings(user.id),
      ]).then(async ([ndRes, ctxRes, collRes, jRes, setRes]) => {
        const nd = ndRes.status === 'fulfilled' ? ndRes.value : [];
        const ctx = ctxRes.status === 'fulfilled' ? ctxRes.value : [];
        const coll = collRes.status === 'fulfilled' ? collRes.value : [];
        const j = jRes.status === 'fulfilled' ? jRes.value : [];
        const sett = setRes.status === 'fulfilled' ? setRes.value : null;
        setNodes({ new_day: nd, context: ctx, collabs: coll });
        setJournalEntries(j);
        if (sett) {
          setSettings({ theme: sett.theme||'night', view_mode: sett.view_mode||'panel', life_default: sett.life_default!==false, rules: { ...DEFAULT_SETTINGS.rules, ...(sett.rules||{}) } });
        } else {
          try { await DB.upsertSettings(user.id, DEFAULT_SETTINGS); } catch(e) {}
        }
        const ndHasLife = buildTree(nd).some(c => c.name === 'life');
        const ctxHasLife = buildTree(ctx).some(c => c.name === 'life');
        if (!ndHasLife || !ctxHasLife) {
          try {
            if (!ndHasLife && !ctxHasLife) await seedLifeForUser(user.id);
            else if (!ndHasLife) await seedAreaLife(user.id, 'new_day');
            else await seedAreaLife(user.id, 'context');
            const [ndNew, ctxNew] = await Promise.all([DB.getNodes(user.id,'new_day'), DB.getNodes(user.id,'context')]);
            setNodes(prev => ({ ...prev, new_day: ndNew, context: ctxNew }));
          } catch(e) { console.error('Seed failed:', e); }
        }
        setDataLoading(false);
      });
    }, [user]);

    function navigate(segs) { setPath(segs); }

    async function reloadNodes(area) {
      if (!user) return;
      try { const fresh = await DB.getNodes(user.id, area); setNodes(prev => ({ ...prev, [area]: fresh })); }
      catch(e) { console.warn('Reload failed:', e); }
    }

    async function reloadJournal() {
      if (!user) return;
      try { setJournalEntries(await DB.getTodayJournal(user.id)); }
      catch(e) {}
    }

    // EOD timer
    useEODTimer(
      user?.id,
      () => setEodBanner({ type: 'warn', msg: '30 minutes until end of day. New_day will be processed at 11:59:59 PM.' }),
      async () => {
        const result = await runEODProcessing(user.id, settings.rules, nodesRef.current, journalRef.current);
        if (result && !result.skipped) {
          try { await reseedNewDayLife(user.id); } catch(e) {}
          await Promise.all([reloadNodes('new_day'), reloadNodes('context'), reloadJournal()]);
          setEodBanner({ type: 'done', msg: `End of day complete: ${result.merged} merged, ${result.archived} archived.` });
        }
      }
    );

    if (authLoading) return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--accent)'}}>Night_OS loading...</div>
    );
    if (!user) return <AuthModal />;

    function renderContent() {
      if (dataLoading) return <div className="loading">Loading workspace...</div>;
      const area = path[0];
      if (!area) return <RootView onNavigate={navigate} viewMode={settings.view_mode} nodes={nodes} />;
      if (area === 'settings') return <SettingsView settings={settings} onSettingsChange={handleSettingsChange} saveStatus={saveStatus} user={user} />;
      if (area === 'new_day' || area === 'context') return (
        <WorkspaceView area={area} path={path} nodes={nodes} contextNodes={nodes.context} viewMode={settings.view_mode} onNavigate={navigate} onReload={reloadNodes} userId={user.id} />
      );
      if (area === 'journal') return <JournalView journalEntries={journalEntries} userId={user.id} onReload={reloadJournal} />;
      if (area === 'archive') return <ArchiveView userId={user.id} onReload={reloadNodes} />;
      if (area === 'collabs') return <CollabsView userId={user.id} nodes={nodes} onReload={reloadNodes} onNavigate={navigate} />;
      return <div className="empty-hint">Unknown area: {area}</div>;
    }

    return (
      <div className="app">
        <Header path={path} onNavigate={navigate} user={user} settings={settings} onSettingsChange={handleSettingsChange} />
        <MapModule path={path} nodes={nodes} onNavigate={navigate} />
        <div className="main">{renderContent()}</div>
        {eodBanner && (
          <div className={`eod-banner ${eodBanner.type}`}>
            <div className="eod-banner-text">
              {eodBanner.type === 'warn' ? '⚠' : '✓'} {eodBanner.msg}
            </div>
            <button className="eod-banner-dismiss" onClick={() => setEodBanner(null)}>Dismiss</button>
          </div>
        )}
        <CommandBar path={path} nodes={nodes} onNavigate={navigate} />
        {inviteModal && (
          <div className="invite-accept-overlay" onClick={e => e.target === e.currentTarget && setInviteModal(null)}>
            <div className="invite-accept-box">
              <div className="invite-accept-title">Project Invite</div>
              <div className="invite-accept-project">{inviteModal.node?.name || 'Shared Project'}</div>
              <div style={{fontSize:13,opacity:0.6,marginBottom:20}}>You've been invited to collaborate on this project.</div>
              <div className="invite-accept-actions">
                <button className="hbtn" style={{borderColor:'var(--dot-green)',color:'var(--dot-green)',padding:'8px 18px'}} onClick={acceptInviteFromLink}>Accept</button>
                <button className="hbtn" style={{borderColor:'var(--dot-red)',color:'var(--dot-red)',padding:'8px 18px'}} onClick={() => { DB.respondCollabInvite(inviteModal.id,'declined',user.id).catch(()=>{}); setInviteModal(null); }}>Decline</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
